<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小小东令牌预览</title>
  <script src="dist/boot.js" data-key="xxd-tokens-preview"></script>
  <link rel="stylesheet" href="dist/tokens.css">
  <script src="../xxd-icons/dist/icons.iife.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: var(--weight-regular) var(--text-sm)/1.6 var(--font-body); }
    main { max-width: 960px; margin: 0 auto; padding: var(--space-6) var(--space-4) 80px; }
    h1 { font: var(--weight-strong) var(--text-2xl)/1.2 var(--font-title); margin: 0 0 var(--space-2); }
    h2 { font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--muted); margin: var(--space-8) 0 var(--space-2); letter-spacing: .02em; }
    p { margin: 0; color: var(--muted); }
    .bar { position: sticky; top: 0; z-index: var(--z-dock); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .bar label { display: flex; gap: var(--space-2); align-items: center; color: var(--muted); font-size: var(--text-xs); }
    .bar select { font: inherit; color: var(--ink); background: transparent; border: 0; padding: 0 var(--space-1); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-3); }
    .swatch { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--paper); }
    .swatch i { display: block; height: 56px; border-bottom: 1px solid var(--line); }
    .swatch div { padding: var(--space-2) var(--space-3); font-size: var(--text-xs); }
    .swatch code { color: var(--muted); font: var(--text-2xs) var(--font-mono); }
    .radii { display: flex; flex-wrap: wrap; gap: var(--space-4); }
    .radii div { width: 96px; height: 64px; border: 1px solid var(--line-strong); display: grid; place-items: center; font: var(--text-2xs) var(--font-mono); color: var(--muted); background: var(--paper); }
    .type > * { margin: 0 0 var(--space-2); }
    .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); border-top: 1px solid var(--line); }
    .icons div { display: grid; justify-items: center; gap: 6px; padding: var(--space-3) var(--space-1); border-bottom: 1px solid var(--line); font-size: 10px; color: var(--muted); }
    .icons div:hover { background: var(--wash); color: var(--ink); }
    .icons svg { color: var(--ink); }
    .accents { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .accents button { width: 28px; height: 28px; border-radius: var(--r-circle); border: 1px solid var(--line-strong); cursor: pointer; padding: 0; }
    .accents button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
    .demo { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper); }
    .btn { height: var(--control-h); padding: 0 var(--space-4); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); font: var(--weight-medium) var(--text-sm) var(--font-body); }
    .btn.primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
    .pill { padding: 2px 10px; border-radius: var(--r-pill); background: var(--selected-bg); font-size: var(--text-xs); }
    .dot { width: 10px; height: 10px; border-radius: var(--r-circle); background: var(--success); }
    a { color: var(--action-text); }
    .motion { width: 120px; height: 40px; background: var(--action); border-radius: var(--r-sm); transition: transform var(--motion-medium) var(--ease-out-expo), opacity var(--motion-quick); }
    .demo:hover .motion { transform: translateX(24px); opacity: .7; }
  </style>
</head>
<body>
  <div class="bar">
    <label>主题 <select id="theme"><option value="light">亮</option><option value="dark">暗</option><option value="system">跟随系统</option></select></label>
    <label>圆角 <select id="corners"><option value="square">直角</option><option value="rounded">圆角</option></select></label>
    <label>密度 <select id="density"><option value="comfortable">标准</option><option value="compact">紧凑</option></select></label>
    <div class="accents" id="accents" aria-label="主色"></div>
  </div>
  <main>
    <h1>小小东令牌</h1>
    <p>黑 / 白 / 灰，秩序，内容优先；默认直角；强调靠墨色。</p>

    <h2>组合示例</h2>
    <div class="demo">
      <button class="btn primary">写入</button>
      <button class="btn">取消</button>
      <span class="pill">状态标签</span>
      <span class="dot" title="语义圆：不跟开关"></span>
      <a href="#">一个链接</a>
      <div class="motion" title="hover 卡片看动效"></div>
    </div>

    <h2>颜色</h2>
    <div class="grid" id="colors"></div>

    <h2>圆角（当前模式）</h2>
    <div class="radii" id="radii"></div>

    <h2>字体</h2>
    <div class="type">
      <p style="font:var(--weight-strong) var(--text-2xl)/1.3 var(--font-title);color:var(--ink)">编辑式标题 Editorial</p>
      <p style="font-size:var(--text-lg);color:var(--ink)">16 · 正文较大的一级</p>
      <p style="font-size:var(--text-sm);color:var(--ink);font-weight:500">13 / 500 · 导航与控件</p>
      <p style="font-size:var(--text-xs)">12 · 菜单与次要信息</p>
      <p style="font-size:var(--text-2xs)">11 · tooltip 与角标</p>
      <p style="font-family:var(--font-mono);font-size:var(--text-xs)">mono · const x = 1</p>
    </div>

    <h2>图标</h2>
    <div class="icons" id="icons"></div>
  </main>
  <script>
    const T = window.XxdTheme;
    const s = { ...T.DEFAULT_SETTINGS, ...T.read() };
    for (const id of ["theme", "corners", "density"]) {
      const el = document.getElementById(id);
      el.value = s[id];
      el.onchange = () => { T.set({ [id]: el.value }); render(); };
    }
    const accents = document.getElementById("accents");
    for (const p of T.ACCENT_PRESETS) {
      const b = document.createElement("button");
      b.title = p.zh;
      b.style.background = p.id || "var(--ink)";
      b.setAttribute("aria-pressed", String((s.accent || "") === p.id));
      b.onclick = () => { T.set({ accent: p.id }); accents.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); render(); };
      accents.append(b);
    }
    const colorNames = ["--bg", "--paper", "--wash", "--wash-strong", "--selected-bg", "--ink", "--muted", "--muted-2", "--line", "--line-strong", "--action", "--action-text", "--success", "--danger", "--warning"];
    function render() {
      const cs = getComputedStyle(document.documentElement);
      document.getElementById("colors").innerHTML = colorNames.map((n) => `<div class="swatch"><i style="background:var(${n})"></i><div>${n}<br><code>${cs.getPropertyValue(n).trim()}</code></div></div>`).join("");
      document.getElementById("radii").innerHTML = ["--r-xs", "--r-sm", "--r-md", "--r-lg", "--r-pill", "--r-circle"].map((n) => `<div style="border-radius:var(${n})">${n}<br>${cs.getPropertyValue(n).trim()}</div>`).join("");
    }
    render();
    document.getElementById("icons").innerHTML = XxdIcons.ICON_NAMES.map((n) => `<div>${XxdIcons.iconSVG(n, { size: 20 })}${n}</div>`).join("");
  </script>
</body>
</html>
