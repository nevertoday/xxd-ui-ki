# 小小东 UI Kit 的最小 CI：推到 main 和提 PR 时运行。
name: xxd
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4 # 和 package.json 的 devEngines 一致；action 不读 devEngines
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudflare/kumo build # @xxd/react 构建要用 Kumo 的产物，先构建
      - run: pnpm xxd:build
      - run: pnpm xxd:test
      - run: pnpm --filter @cloudflare/kumo test
      - run: pnpm lint
